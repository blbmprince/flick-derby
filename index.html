<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101418">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Flick Derby</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Teko:wght@500;600&display=swap">
<style>
/* Layout: one-screen floodlit table: scoreboard strip, scrolling long-pitch canvas (wheel and shootout take it over), status + control rail beneath */
:root{
  color-scheme: dark;
  --table:#101418; --panel:#1a2027; --edge:#2c343d; --ink:#eef2f5; --muted:#8e99a6;
  --red:#ff5b3a; --blue:#38b6ff; --gold:#ffd166; --on-gold:#1a1405;
  --display:"Teko","Arial Narrow",Impact,sans-serif;
  --ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--ui);font-size:16px;overflow:hidden}
.app{height:100%;box-sizing:border-box;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:4px 14px}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.team.blue{justify-content:flex-end;text-align:right}
.team .name{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px}
.team .left{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums}
.team.red .name{color:var(--red)} .team.blue .name{color:var(--blue)}
.score{font-family:var(--display);font-size:46px;line-height:.9;font-variant-numeric:tabular-nums;padding-top:6px}
.mid{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap}
.mid b{display:block;font-family:var(--display);font-size:24px;letter-spacing:.03em;color:var(--ink);font-weight:500;line-height:1;padding-top:3px}
.stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ov{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2}
.ov button{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:.06em;padding:6px 30px 2px;border-radius:12px;box-shadow:0 0 0 3px rgba(255,209,102,.25),0 8px 24px rgba(0,0,0,.5)}
.rail{display:flex;flex-direction:column;gap:8px}
.status{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;min-height:24px}
.shots{display:flex;align-items:center;gap:6px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.shot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);box-sizing:border-box}
.shot.on{background:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .lbl{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid currentColor}
.chip.next{background:currentColor}
.chip.next span{color:var(--table)}
.msg{min-height:22px;text-align:center;font-size:17px;font-weight:500;text-wrap:balance}
.msg em{font-style:normal;font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--edge);color:var(--ink)}
@media (max-width:440px){
  .score{font-size:38px} .team .name{font-size:13px} .mid b{font-size:19px} .mid{font-size:10px}
  button{padding:7px 10px;font-size:14px} .msg{font-size:15px} .ov button{font-size:26px}
}
</style>
</head>
<body>

<div class="app">
  <header class="board">
    <div class="team red">
      <div class="score" id="sRed">0</div>
      <div><div class="name">Reds</div><div class="left" id="lRed">10 defenders</div></div>
    </div>
    <div class="mid" id="roundLbl">Attack 1 of 5<b id="turnLbl">Set up</b></div>
    <div class="team blue">
      <div><div class="name">Blues</div><div class="left" id="lBlue">10 defenders</div></div>
      <div class="score" id="sBlue">0</div>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Long football pitch"></canvas>
    <div class="ov" id="ov" hidden><button class="primary" id="ovBtn">Spin</button></div>
  </main>
  <footer class="rail">
    <div class="status" id="status"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="controls">
      <button class="primary" id="go">Kick off</button>
      <button id="shuffle">Shuffle</button>
      <div class="seg" role="group" aria-label="Opponent">
        <button id="mCpu" aria-pressed="true">vs CPU</button>
        <button id="mPvp" aria-pressed="false">2 players</button>
        <button id="mPrac" aria-pressed="false">Practice</button>
        <button id="mPens" aria-pressed="false">Penalties</button>
      </div>
      <button id="newBtn">New match</button>
      <button id="snd" aria-pressed="true">Sound on</button>
    </div>
  </footer>
</div>

<script>
(() => {
// ================= CONFIG: every tunable number lives here =================
const CFG = {
  maxV: 1900, pull: 170, ballR: 14, airZ: 16,              // airZ: a bouncing ball this high passes over players
  dmgMin: 80, dmgPerSpeed: 0.03, hitCooldown: 0.2,         // body-hit damage from impact speed
  spin: { detect: 70, decay: 3 },                          // how far beyond their reach a player notices the ball
  balls: {
    normal:    { cat: 'normal',   label: 'Normal',    c: '#f4f6f8', pen: 0.6,  marker: 1.1, note: 'An ordinary ball.' },
    stone:     { cat: 'power',    label: 'Stone',     c: '#9aa3ad', pen: 0.70, marker: 1.1, note: 'A 100% power hit wipes out a player. Heavy.' },
    flame:     { cat: 'power',    label: 'Flame',     c: '#ff8a2a', pen: 0.75, marker: 1.6, pct: 0.5, note: 'A hit burns away half a player’s health.' },
    bouncing:  { cat: 'power',    label: 'Bouncing',  c: '#ff5fa2', pen: 0.65, marker: 1.6, vz: 420, g: 1100, note: 'Bounces over players’ heads.' },
    snail:     { cat: 'negative', label: 'Snail',     c: '#9dff8a', pen: 0.30, marker: 0.55, speed: 0.35, drag: 2.2, note: 'Crawls along and leaves slime for two turns.' },
    glue:      { cat: 'negative', label: 'Glue',      c: '#f2e6a0', pen: 0.35, marker: 0.55, note: 'Sticks to the first thing it touches.' },
    boomerang: { cat: 'negative', label: 'Boomerang', c: '#c59bff', pen: 0.40, marker: 1.1, after: 0.45, turn: 3.2, note: 'Curves back towards whoever kicked it.' },
    speed:     { cat: 'special',  label: 'Speed',     c: '#38e8ff', pen: 0.85, marker: 2.4, speed: 1.5, note: '50% faster and further.' },
    lightning: { cat: 'special',  label: 'Lightning', c: '#fff36b', pen: 0.80, marker: 1.6, radius: 180, pct: 0.5, note: 'Shocks every rival nearby when it stops.' },
    rocket:    { cat: 'special',  label: 'Rocket',    c: '#ff4a3a', pen: 0.90, marker: 2.4, speed: 1350, dist: 800, note: 'Zigzags wildly towards goal.' },
  },
  slime: { slow: 0.5, turns: 2, r: 13 },
  arms: { hammerPct: 0.25, sawPct: 0.10, playerCooldown: 0.6, sawSpin: 16 },
  penalties: { rounds: 5, keeper: 0.95 },
};
const POWER_NEG = ['stone', 'flame', 'bouncing', 'snail', 'glue', 'boomerang'];
const SPECIALS = ['speed', 'lightning', 'rocket'];
const ALL_BALLS = [...POWER_NEG, ...SPECIALS];
const SLIME_IMMUNE = new Set(['speed', 'rocket', 'bouncing', 'snail']);

// ================= constants =================
const W = 420, H = 2400, GW = 140, GL = (W - GW) / 2, GR = GL + GW, GD = 46, SIDE = 24;
const BALL_R = CFG.ballR, MAXV = CFG.maxV, PULL = CFG.pull, SHOTS = 3, ATTACKS = 5, NDEF = 10;
const POST_R = 5, POSTS = [[GL, 0], [GR, 0], [GL, H], [GR, H]];
const FIX = 1 / 60, SUB = 4;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TEAM = {
  red:  { name: 'Reds',  c: '#ff5b3a', l: '#ff9a7f', d: '#9e2f19', gk: '#ffd166' },
  blue: { name: 'Blues', c: '#38b6ff', l: '#93d8ff', d: '#17618f', gk: '#7dffb0' },
};
const other = t => t === 'red' ? 'blue' : 'red';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
const $ = id => document.getElementById(id);
let uid = 0;

// Footballer types. Bigger = stronger and tougher but slower to run and to spin.
const KINDS = {
  thin:    { name: 'Beanpole',   r: 15, m: 3,  hp: 50,  e: 0.9,  ball: 'flame',     move: 'lr',     amp: 110, sp: 1.7, run: 300, rotSpeed: 14, strength: 0.7, reaction: 9,   reach: 26, limbW: 4,   bw: 0.8, bd: 0.5,  hd: 0.6 },
  fat:     { name: 'Big lad',    r: 31, m: 12, hp: 160, e: 1.05, ball: 'stone',     move: 'circle', amp: 18,  sp: 0.9, run: 150, rotSpeed: 6,  strength: 1.6, reaction: 3.5, reach: 16, limbW: 8,   bw: 1,   bd: 0.9,  hd: 0.38 },
  winger:  { name: 'Winger',     r: 19, m: 5,  hp: 80,  e: 0.85, ball: 'bouncing',  move: 'lr',     amp: 150, sp: 1.0, run: 280, rotSpeed: 12, strength: 0.9, reaction: 8,   reach: 22, limbW: 5,   bw: 1,   bd: 0.6,  hd: 0.46 },
  mid:     { name: 'Box-to-box', r: 21, m: 6,  hp: 100, e: 0.85, ball: 'boomerang', move: 'ud',     amp: 30,  sp: 1.9, run: 230, rotSpeed: 10, strength: 1.1, reaction: 6,   reach: 22, limbW: 5.5, bw: 1,   bd: 0.62, hd: 0.45 },
  spinner: { name: 'Spinner',    r: 21, m: 6,  hp: 90,  e: 0.85, ball: 'glue',      move: 'circle', amp: 32,  sp: 2.3, run: 230, rotSpeed: 16, strength: 1.0, reaction: 10,  reach: 24, limbW: 5,   bw: 1,   bd: 0.6,  hd: 0.45 },
};
const KEEPER = { r: 17, m: 99, reach: 26, limbW: 6, rotSpeed: 11, strength: 1.3, reaction: 7, bw: 1, bd: 0.62, hd: 0.45 };
const LINEUP = ['thin', 'thin', 'fat', 'fat', 'winger', 'winger', 'mid', 'mid', 'spinner', 'spinner'];
const MOVE_AMP = { circle: 28, lr: 120, ud: 30 };
const SKIN = ['#f1c7a3', '#d9a07a', '#a86b45', '#7a4a2c', '#5a3520'], HAIR = ['#1d1612', '#3b2616', '#8a5a2b', '#d8b46a', '#2a2a2a'];

function makeCracks(R) {
  const out = [];
  for (let i = 0; i < 7; i++) {
    let a = Math.random() * Math.PI * 2, r = 3 + Math.random() * 5;
    const pts = [[Math.cos(a) * r, Math.sin(a) * r]];
    for (let k = 0; k < 4; k++) { a += (Math.random() - 0.5) * 0.9; r = Math.min(r + R / 4 * (0.7 + Math.random() * 0.5), R); pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
    out.push(pts);
  }
  return out;
}
function newObs(team, kind, x, y, ang = 0, band = 0) {
  const k = KINDS[kind], mystery = Math.random() < 0.3;
  return {
    id: ++uid, team, kind, x, y, band, vx: 0, vy: 0, m: k.m, r: k.r, br: k.r, e: k.e,
    run: k.run, rotSpeed: k.rotSpeed, strength: k.strength, reaction: k.reaction, reach: k.reach, limbW: k.limbW,
    rot: team === 'blue' ? Math.PI / 2 : -Math.PI / 2, w: 0, spinning: false, spinDir: 1,
    hx: x, hy: y, move: k.move, amp: k.amp, sp: k.sp, ph: Math.random() * Math.PI * 2, stun: 0,
    face: team === 'blue' ? Math.PI / 2 : -Math.PI / 2, step: Math.random() * 6, num: 2 + (Math.random() * 18 | 0),
    skin: SKIN[Math.random() * SKIN.length | 0], hair: HAIR[Math.random() * HAIR.length | 0],
    hp: k.hp, maxHp: k.hp, ball: mystery ? POWER_NEG[Math.random() * POWER_NEG.length | 0] : k.ball, mystery,
    flash: 0, burnVis: 0, hitCD: 0, armCD: 0, cracks: makeCracks(k.r),
  };
}

// ================= arms: Standard / Hammer / Buzzsaw, each with its own wall button =================
const ARM_DEFS = [
  [0, 380, 2.4, 0.0], [1, 2020, 2.4, 0.0],
  [1, 780, 2.0, 1.3], [0, 1620, 2.0, 1.3],
  [0, 1200, 2.8, 2.2], [1, 1200, 2.8, 2.2],
].map(([side, y, w, ph], i) => ({ i, side, px: side ? W : 0, py: y, len: 150, r: 9, amp: 1.15, w, ph, btnY: side ? y - 160 : y + 160, sawDir: i % 2 ? 1 : -1 }));
const ARM_TYPES = ['standard', 'hammer', 'buzzsaw'];
const newArms = () => ARM_DEFS.map(a => ({ ...a, type: 'standard', cool: 0, flash: 0 }));
function armAng(w, a) {
  const base = a.side ? Math.PI : 0;
  if (a.type === 'hammer') return base + 1.3 * Math.sin(a.w * 1.7 * w.t + a.ph);
  if (a.type === 'buzzsaw') return base + 0.5 * Math.sin(a.w * 0.6 * w.t + a.ph);
  return base + a.amp * Math.sin(a.w * w.t + a.ph);
}
function armOm(w, a) {
  if (a.type === 'hammer') return 1.3 * a.w * 1.7 * Math.cos(a.w * 1.7 * w.t + a.ph);
  if (a.type === 'buzzsaw') return 0.5 * a.w * 0.6 * Math.cos(a.w * 0.6 * w.t + a.ph);
  return a.amp * a.w * Math.cos(a.w * w.t + a.ph);
}
const armLen = a => a.type === 'buzzsaw' ? 95 : 150;
const headR = a => a.type === 'hammer' ? 18 : a.type === 'buzzsaw' ? 34 : 0;

// ================= challenge boards: three windows each on the side walls =================
const BOARDS = [{ side: 0, y: 640 }, { side: 0, y: 900 }, { side: 1, y: 1500 }, { side: 1, y: 1760 }];
const WIN_OFF = [-44, 0, 44], WIN_H = 17;

// ================= goalkeepers: characters that slide across the goal =================
const KEEP = { amp: GW / 2 - 8, w: 0.9, depth: 58 };
const keeperY = team => team === 'blue' ? KEEP.depth : H - KEEP.depth;
const keeperPh = (w, team) => KEEP.w * w.kt + (team === 'red' ? Math.PI : 0);
const keeperX = (w, team) => W / 2 + KEEP.amp * Math.sin(keeperPh(w, team));
const keeperVx = (w, team) => KEEP.amp * KEEP.w * Math.cos(keeperPh(w, team));
function newKeeper(team) {
  return { id: team === 'red' ? -1 : -2, team, keeper: true, ...KEEPER, x: W / 2, y: keeperY(team), vx: 0, vy: 0,
    rot: team === 'blue' ? Math.PI / 2 : -Math.PI / 2, w: 0, spinning: false, spinDir: 1, skin: '#d9a07a', hair: '#2a1d14', step: 0 };
}

// ================= physics =================
const newBall = () => ({ x: W / 2, y: H / 2, vx: 0, vy: 0, r: BALL_R, spin: 0, type: 'normal', z: 0, vz: 0, shotPw: 0, touched: false,
  glued: false, glueNow: false, ox: 0, oy: 0, flightT: 0, travelled: 0, slimeCD: 0, rocketOn: false, boomOn: false, lastSlime: null });
function launch(w, b, ang, pw, type) {
  const B = CFG.balls[type];
  b.type = type; b.shotPw = pw; b.z = 0; b.vz = 0; b.glued = false; b.glueNow = false; b.flightT = 0; b.travelled = 0; b.slimeCD = 0;
  b.ox = b.x; b.oy = b.y; b.rocketOn = type === 'rocket'; b.boomOn = type === 'boomerang'; b.lastSlime = null;
  let v = pw * MAXV;
  if (type === 'snail') v *= B.speed;
  if (type === 'speed') v *= B.speed;
  if (type === 'rocket') v = B.speed;
  if (type === 'bouncing') b.vz = B.vz * (0.6 + 0.4 * pw);
  b.vx = Math.cos(ang) * v; b.vy = Math.sin(ang) * v;
}
const cloneWorld = w => ({ ...w, ball: { ...w.ball }, obs: w.obs.map(o => ({ ...o })), arms: w.arms.map(a => ({ ...a })),
  keepers: { red: { ...w.keepers.red }, blue: { ...w.keepers.blue } }, slime: w.slime.slice(), goal: null, real: false });

function bounce(b, ct, svx, svy, e) {
  b.x += ct.nx * ct.pen; b.y += ct.ny * ct.pen;
  const vn = (b.vx - svx) * ct.nx + (b.vy - svy) * ct.ny;
  if (vn >= 0) return 0;
  b.vx -= (1 + e) * vn * ct.nx; b.vy -= (1 + e) * vn * ct.ny;
  return -vn;
}
function touch(b) { b.touched = true; if (b.type === 'glue' && !b.glued) b.glueNow = true; }
function post(b, px, py, ev) {
  const dx = b.x - px, dy = b.y - py, rr = b.r + POST_R, d = Math.hypot(dx, dy);
  if (d >= rr || d === 0) return;
  touch(b);
  const s = bounce(b, { nx: dx / d, ny: dy / d, pen: rr - d }, 0, 0, 0.85);
  if (s > 80) ev.push({ t: 'post', s });
}
function walls(w, b, ev) {
  let hit = 0, side = -1; const e = 0.86;
  if (b.x - b.r < 0) { b.x = b.r; if (b.vx < 0) { hit = -b.vx; b.vx = -b.vx * e; side = 0; } }
  else if (b.x + b.r > W) { b.x = W - b.r; if (b.vx > 0) { hit = b.vx; b.vx = -b.vx * e; side = 1; } }
  if (!(b.x > GL && b.x < GR)) {
    if (b.y - b.r < 0) { b.y = b.r; if (b.vy < 0) { hit = Math.max(hit, -b.vy); b.vy = -b.vy * e; } }
    else if (b.y + b.r > H) { b.y = H - b.r; if (b.vy > 0) { hit = Math.max(hit, b.vy); b.vy = -b.vy * e; } }
  } else {
    if (b.y < 0 || b.y > H) {
      if (b.x - b.r < GL) { b.x = GL + b.r; if (b.vx < 0) b.vx = -b.vx * e; }
      else if (b.x + b.r > GR) { b.x = GR - b.r; if (b.vx > 0) b.vx = -b.vx * e; }
    }
    if (b.y + b.r < 0) w.goal = 'top'; else if (b.y - b.r > H) w.goal = 'bottom';
  }
  if (hit > 0) touch(b);
  if (side >= 0) {
    // wall buttons: each one transforms only its own arm
    for (const a of w.arms) {
      if (a.side !== side || a.cool > 0 || Math.abs(b.y - a.btnY) > 24) continue;
      const opts = ARM_TYPES.filter(t => t !== a.type);
      a.type = opts[Math.random() * opts.length | 0]; a.cool = 0.8; a.flash = 1;
      ev.push({ t: 'transform', arm: a.i, type: a.type, x: a.px, y: a.btnY });
    }
    ev.push({ t: 'sidewall', side, y: b.y });
  }
  if (hit > 60) ev.push({ t: 'wall', s: hit });
}
function segClosest(ax, ay, bx, by, px, py) {
  const ex = bx - ax, ey = by - ay, t = clamp(((px - ax) * ex + (py - ay) * ey) / (ex * ex + ey * ey || 1), 0, 1);
  return [ax + ex * t, ay + ey * t];
}
// ----- players' arms and feet -----
function limbSegs(a) {
  const out = [], k = a.rot;
  for (const s of [1, -1]) { const g = k + s * Math.PI / 2, c = Math.cos(g), n = Math.sin(g); out.push([a.x + c * a.r * 0.7, a.y + n * a.r * 0.7, a.x + c * (a.r + a.reach), a.y + n * (a.r + a.reach), a.limbW, 'arm']); }
  for (const g of [k, k + Math.PI]) { const c = Math.cos(g), n = Math.sin(g); out.push([a.x + c * a.r * 0.4, a.y + n * a.r * 0.4, a.x + c * (a.r * 0.4 + a.reach * 0.75), a.y + n * (a.r * 0.4 + a.reach * 0.75), a.limbW + 1, 'foot']); }
  return out;
}
function hitLimbs(w, a, ev) {
  const b = w.ball;
  if (Math.hypot(b.x - a.x, b.y - a.y) > a.r + a.reach + b.r + a.limbW + 2) return;
  for (const [x1, y1, x2, y2, cap] of limbSegs(a)) {
    const [qx, qy] = segClosest(x1, y1, x2, y2, b.x, b.y), dx = b.x - qx, dy = b.y - qy, d = Math.hypot(dx, dy) || 0.01;
    if (d >= cap + b.r) continue;
