<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101418">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Flick Derby</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Teko:wght@500;600&display=swap">
<style>
/* Layout: one-screen floodlit table: scoreboard strip, scrolling long-pitch canvas, status + control rail beneath */
:root{
  color-scheme: dark;
  --table:#101418; --panel:#1a2027; --edge:#2c343d; --ink:#eef2f5; --muted:#8e99a6;
  --red:#ff5b3a; --blue:#38b6ff; --gold:#ffd166; --on-gold:#1a1405;
  --fire:#ff8a2a; --freeze:#9fe8ff; --bomb:#ff5fa2; --ghost:#cdb8ff; --god:#ffe066; --heavy:#aab4bf; --snail:#c9a46a; --jelly:#9dff8a;
  --display:"Teko","Arial Narrow",Impact,sans-serif;
  --ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--table);color:var(--ink);font-family:var(--ui);font-size:16px;overflow:hidden}
.app{height:100%;box-sizing:border-box;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:4px 14px}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.team.blue{justify-content:flex-end;text-align:right}
.team .name{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:15px}
.team .left{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums}
.team.red .name{color:var(--red)} .team.blue .name{color:var(--blue)}
.score{font-family:var(--display);font-size:46px;line-height:.9;font-variant-numeric:tabular-nums;padding-top:6px}
.mid{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap}
.mid b{display:block;font-family:var(--display);font-size:24px;letter-spacing:.03em;color:var(--ink);font-weight:500;line-height:1;padding-top:3px}
.stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.rail{display:flex;flex-direction:column;gap:8px}
.status{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;min-height:24px}
.shots{display:flex;align-items:center;gap:6px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.shot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);box-sizing:border-box}
.shot.on{background:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid currentColor}
.msg{min-height:22px;text-align:center;font-size:17px;font-weight:500;text-wrap:balance}
.msg em{font-style:normal;font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--edge);color:var(--ink)}
@media (max-width:440px){
  .score{font-size:38px} .team .name{font-size:13px} .mid b{font-size:19px} .mid{font-size:10px}
  button{padding:7px 10px;font-size:14px} .msg{font-size:15px}
}
</style>
</head>
<body>

<div class="app">
  <header class="board">
    <div class="team red">
      <div class="score" id="sRed">0</div>
      <div><div class="name">Reds</div><div class="left" id="lRed">10 defenders</div></div>
    </div>
    <div class="mid" id="roundLbl">Attack 1 of 5<b id="turnLbl">Set up</b></div>
    <div class="team blue">
      <div><div class="name">Blues</div><div class="left" id="lBlue">10 defenders</div></div>
      <div class="score" id="sBlue">0</div>
    </div>
  </header>
  <main class="stage" id="stage"><canvas id="cv" aria-label="Long football pitch"></canvas></main>
  <footer class="rail">
    <div class="status" id="status"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="controls">
      <button class="primary" id="go">Kick off</button>
      <button id="shuffle">Shuffle</button>
      <div class="seg" role="group" aria-label="Opponent">
        <button id="mCpu" aria-pressed="true">vs CPU</button>
        <button id="mPvp" aria-pressed="false">2 players</button>
        <button id="mPrac" aria-pressed="false">Practice</button>
      </div>
      <button id="newBtn">New match</button>
      <button id="snd" aria-pressed="true">Sound on</button>
    </div>
  </footer>
</div>

<script>
(() => {
// ---------- constants ----------
const W = 420, H = 2400, GW = 140, GL = (W - GW) / 2, GR = GL + GW, GD = 46, SIDE = 24;
const BALL_R = 14, MAXV = 1900, PULL = 170, SHOTS = 3, ATTACKS = 5, NDEF = 10;
const POST_R = 5, POSTS = [[GL, 0], [GR, 0], [GL, H], [GR, H]];
const FIX = 1 / 60, SUB = 4;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TEAM = {
  red:  { name: 'Reds',  c: '#ff5b3a', l: '#ff9a7f', d: '#9e2f19' },
  blue: { name: 'Blues', c: '#38b6ff', l: '#93d8ff', d: '#17618f' },
};
const POWER = {
  fire:   { label: 'Fire',   c: '#ff8a2a', note: 'sets defenders on fire, burning away half their health' },
  freeze: { label: 'Freeze', c: '#9fe8ff', note: 'stops the arms, makes defenders brittle' },
  bomb:   { label: 'Bomb',   c: '#ff5fa2', note: 'explodes on the first defender it hits each shot' },
  ghost:  { label: 'Ghost',  c: '#cdb8ff', note: 'passes through the swinging arms and goalkeepers' },
  god:    { label: 'God mode', c: '#ffe066', note: 'a 100% power shot destroys any defender it touches' },
  heavy:  { label: 'Heavyweight', c: '#aab4bf', note: 'really heavy: barges defenders out of the way' },
  snail:  { label: 'Snail',  c: '#c9a46a', note: 'every shot crawls along really slowly' },
  jelly:  { label: 'Jelly',  c: '#9dff8a', note: 'wobbly and extra bouncy, but hits softer' },
};
const POWERS = Object.keys(POWER);
const other = t => t === 'red' ? 'blue' : 'red';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const $ = id => document.getElementById(id);
let uid = 0;

// ---------- shapes ----------
const ngon = (n, r, rot = -Math.PI / 2) => Array.from({ length: n }, (_, i) => { const a = rot + i * 2 * Math.PI / n; return [Math.cos(a) * r, Math.sin(a) * r]; });
const rect = (hw, hh) => [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
function normals(v) {
  return v.map((a, i) => {
    const b = v[(i + 1) % v.length];
    let nx = b[1] - a[1], ny = -(b[0] - a[0]); const l = Math.hypot(nx, ny); nx /= l; ny /= l;
    if (nx * -a[0] + ny * -a[1] > 0) { nx = -nx; ny = -ny; }
    return [nx, ny];
  });
}
// Footballer types: size, weight, toughness, how they run, and the power they drop
const KINDS = {
  thin:    { name: 'Beanpole',   r: 15, m: 3,  hp: 50,  e: 0.9,  power: 'fire',   move: 'lr',     amp: 110, sp: 1.7, bw: 0.8, bd: 0.5, hd: 0.6 },
  fat:     { name: 'Big lad',    r: 31, m: 12, hp: 160, e: 1.05, power: 'god',    move: 'circle', amp: 18,  sp: 0.9, bw: 1,   bd: 0.9, hd: 0.38 },
  winger:  { name: 'Winger',     r: 19, m: 5,  hp: 80,  e: 0.85, power: 'bomb',   move: 'lr',     amp: 150, sp: 1.0, bw: 1,   bd: 0.6, hd: 0.46 },
  mid:     { name: 'Box-to-box', r: 21, m: 6,  hp: 100, e: 0.85, power: 'freeze', move: 'ud',     amp: 30,  sp: 1.9, bw: 1,   bd: 0.62, hd: 0.45 },
  spinner: { name: 'Spinner',    r: 21, m: 6,  hp: 90,  e: 0.85, power: 'ghost',  move: 'circle', amp: 32,  sp: 2.3, bw: 1,   bd: 0.6, hd: 0.45 },
};
for (const k of Object.values(KINDS)) { k.shape = 'circle'; k.br = k.r; }
const LINEUP = ['thin', 'thin', 'fat', 'fat', 'winger', 'winger', 'mid', 'mid', 'spinner', 'spinner'];
const MOVE_AMP = { circle: 28, lr: 120, ud: 30 };
const SKIN = ['#f1c7a3', '#d9a07a', '#a86b45', '#7a4a2c', '#5a3520'], HAIR = ['#1d1612', '#3b2616', '#8a5a2b', '#d8b46a', '#2a2a2a'];

function makeCracks(R) {
  const out = [];
  for (let i = 0; i < 7; i++) {
    let a = Math.random() * Math.PI * 2, r = 3 + Math.random() * 5;
    const pts = [[Math.cos(a) * r, Math.sin(a) * r]];
    for (let k = 0; k < 4; k++) { a += (Math.random() - 0.5) * 0.9; r = Math.min(r + R / 4 * (0.7 + Math.random() * 0.5), R); pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
    out.push(pts);
  }
  return out;
}
function newObs(team, kind, x, y, ang = 0, band = 0) {
  const k = KINDS[kind], br = k.br || k.r;
  return {
    id: ++uid, team, kind, shape: k.shape, x, y, ang, band, vx: 0, vy: 0, av: 0, m: k.m, I: 0.5 * k.m * br * br,
    spin: 0, hx: x, hy: y, move: k.move, amp: k.amp, sp: k.sp, ph: Math.random() * Math.PI * 2, stun: 0,
    face: team === 'blue' ? Math.PI / 2 : -Math.PI / 2, run: Math.random() * 6, num: 2 + (Math.random() * 18 | 0),
    skin: SKIN[Math.random() * SKIN.length | 0], hair: HAIR[Math.random() * HAIR.length | 0],
    verts: k.verts, norms: k.norms, r: k.r || 0, br: k.br || k.r,
    hp: k.hp, maxHp: k.hp, e: k.e, ...(Math.random() < 0.3 ? { power: POWERS[Math.random() * POWERS.length | 0], mystery: true } : { power: k.power, mystery: false }),
    flash: 0, burn: 0, frozen: false, cracks: makeCracks(k.br || k.r),
  };
}

// ---------- arms (point-symmetric so both ends play the same) ----------
const ARMS = [
  [0, 380, 2.4, 0.0], [1, 2020, 2.4, 0.0],
  [1, 780, 2.0, 1.3], [0, 1620, 2.0, 1.3],
  [0, 1200, 2.8, 2.2], [1, 1200, 2.8, 2.2],
].map(([side, y, w, ph]) => ({ side, px: side ? W : 0, py: y, len: 150, r: 9, amp: 1.15, w, ph }));
const armAng = (w, a) => (a.side ? Math.PI : 0) + a.amp * Math.sin(a.w * w.t + a.ph);
const armOm = (w, a) => w.ball.freeze ? 0 : a.amp * a.w * Math.cos(a.w * w.t + a.ph);

// ---------- goalkeepers: slide across their goal mouth on their own ----------
const KEEP = { half: 34, r: 12, amp: GW / 2 - 6, w: 0.9, depth: 58 };
const keeperY = team => team === 'blue' ? KEEP.depth : H - KEEP.depth;
const keeperPh = (w, team) => KEEP.w * w.kt + (team === 'red' ? Math.PI : 0);
const keeperX = (w, team) => W / 2 + KEEP.amp * Math.sin(keeperPh(w, team));
const keeperVx = (w, team) => w.ball.freeze ? 0 : KEEP.amp * KEEP.w * Math.cos(keeperPh(w, team));

// ---------- physics ----------
const newBall = () => ({ x: W / 2, y: H / 2, vx: 0, vy: 0, r: BALL_R, spin: 0, fire: false, freeze: false, bomb: false, ghost: false, god: false, heavy: false, snail: false, jelly: false, bombLive: false, left: 0, shotPw: 0 });
function launch(b, ang, pw) { b.shotPw = pw; const v = pw * MAXV * (b.snail ? 0.4 : 1); b.vx = Math.cos(ang) * v; b.vy = Math.sin(ang) * v; }
const cloneWorld = w => ({ ball: { ...w.ball }, obs: w.obs.map(o => ({ ...o })), t: w.t, kt: w.kt, attacker: w.attacker, goal: null });

function contact(o, x, y, r) {
  if (o.shape === 'circle') {
    const dx = x - o.x, dy = y - o.y, d = Math.hypot(dx, dy) || 0.01;
    if (d >= o.r + r) return null;
    return { nx: dx / d, ny: dy / d, pen: o.r + r - d, px: o.x + dx / d * o.r, py: o.y + dy / d * o.r };
  }
  const c = Math.cos(o.ang), s = Math.sin(o.ang), dx = x - o.x, dy = y - o.y;
  const lx = dx * c + dy * s, ly = -dx * s + dy * c;
  if (lx * lx + ly * ly > (o.br + r) ** 2) return null;
  const v = o.verts, ns = o.norms;
  let maxD = -1e9, mi = 0;
  for (let i = 0; i < v.length; i++) { const d = ns[i][0] * (lx - v[i][0]) + ns[i][1] * (ly - v[i][1]); if (d > maxD) { maxD = d; mi = i; } }
  if (maxD > r) return null;
  let nx, ny, pen, qx, qy;
  if (maxD <= 0) { nx = ns[mi][0]; ny = ns[mi][1]; pen = r - maxD; qx = lx - nx * maxD; qy = ly - ny * maxD; }
  else {
    let best = 1e9;
    for (let i = 0; i < v.length; i++) {
      const a = v[i], b = v[(i + 1) % v.length], ex = b[0] - a[0], ey = b[1] - a[1];
      const t = clamp(((lx - a[0]) * ex + (ly - a[1]) * ey) / (ex * ex + ey * ey), 0, 1);
      const cx = a[0] + ex * t, cy = a[1] + ey * t, d2 = (lx - cx) ** 2 + (ly - cy) ** 2;
      if (d2 < best) { best = d2; qx = cx; qy = cy; }
    }
    const d = Math.sqrt(best); if (d >= r) return null;
    nx = (lx - qx) / d; ny = (ly - qy) / d; pen = r - d;
  }
  return { nx: nx * c - ny * s, ny: nx * s + ny * c, pen, px: o.x + qx * c - qy * s, py: o.y + qx * s + qy * c };
}
function bounce(b, ct, svx, svy, e) {
  b.x += ct.nx * ct.pen; b.y += ct.ny * ct.pen;
  const vn = (b.vx - svx) * ct.nx + (b.vy - svy) * ct.ny;
  if (vn >= 0) return 0;
  b.vx -= (1 + e) * vn * ct.nx; b.vy -= (1 + e) * vn * ct.ny;
  return -vn;
}
function post(b, px, py, ev) {
  const dx = b.x - px, dy = b.y - py, rr = b.r + POST_R, d = Math.hypot(dx, dy);
  if (d >= rr || d === 0) return;
  b.touched = true;
  const s = bounce(b, { nx: dx / d, ny: dy / d, pen: rr - d }, 0, 0, 0.85);
  if (s > 80) ev.push({ t: 'post', s });
}
function walls(w, b, ev) {
  let hit = 0; const e = b.jelly ? 0.97 : 0.86;
  if (b.x - b.r < 0) { b.x = b.r; if (b.vx < 0) { hit = -b.vx; b.vx = -b.vx * e; } }
  else if (b.x + b.r > W) { b.x = W - b.r; if (b.vx > 0) { hit = b.vx; b.vx = -b.vx * e; } }
  if (!(b.x > GL && b.x < GR)) {
    if (b.y - b.r < 0) { b.y = b.r; if (b.vy < 0) { hit = Math.max(hit, -b.vy); b.vy = -b.vy * e; } }
    else if (b.y + b.r > H) { b.y = H - b.r; if (b.vy > 0) { hit = Math.max(hit, b.vy); b.vy = -b.vy * e; } }
  } else {
    if (b.y < 0 || b.y > H) {
      if (b.x - b.r < GL) { b.x = GL + b.r; if (b.vx < 0) b.vx = -b.vx * e; }
      else if (b.x + b.r > GR) { b.x = GR - b.r; if (b.vx > 0) b.vx = -b.vx * e; }
    }
    if (b.y + b.r < 0) w.goal = 'top'; else if (b.y - b.r > H) w.goal = 'bottom';
  }
  if (hit > 0) b.touched = true;
  if (hit > 60) ev.push({ t: 'wall', s: hit });
}
function blast(w, x, y, ev) {
  ev.push({ t: 'blast', x, y });
  const b = w.ball, R = 170;
  for (const o of w.obs) {
    if (o.team === w.attacker || o.hp <= 0) continue;
    const d = Math.hypot(o.x - x, o.y - y); if (d > R) continue;
    o.hp -= 75 * (1 - d / R); o.flash = 1;
  }
  const dx = b.x - x, dy = b.y - y, d = Math.hypot(dx, dy) || 1;
  b.vx += dx / d * 500; b.vy += dy / d * 500;
}
function hitObs(w, o, ev) {
  const b = w.ball, ct = contact(o, b.x, b.y, b.r);
  if (!ct) return;
  const om = (o.frozen ? 0 : o.spin) + o.av, rx = ct.px - o.x, ry = ct.py - o.y;
  const svx = o.vx - om * ry, svy = o.vy + om * rx;
  const vn = (b.vx - svx) * ct.nx + (b.vy - svy) * ct.ny;
  b.touched = true;
  if (vn >= 0) { b.x += ct.nx * ct.pen; b.y += ct.ny * ct.pen; return; }
  const s = -vn;
  o.stun = 0.9; // knocked off their feet for a moment
  let mult = 1; if (o.frozen) mult *= 2; if (b.jelly) mult *= 0.5;
  const godHit = b.god && b.shotPw >= 0.995; // God mode only works on a full-power shot
  const dmg = godHit ? o.hp + 1 : Math.max(0, s - 80) * 0.03 * mult;
  if (dmg > 0) { o.hp -= dmg; o.flash = 1; }
  // Fire: sets the defender alight once, burning away half its full health over two seconds
  if (b.fire && !o.burnt) { o.burnt = true; o.burn = 2; o.burnRate = o.maxHp * 0.25; }
  if (b.freeze && !o.frozen) { o.frozen = true; ev.push({ t: 'frz', x: o.x, y: o.y }); }
  ev.push({ t: 'hit', x: ct.px, y: ct.py, s, kind: o.kind });
  if (b.bombLive) { b.bombLive = false; blast(w, o.x, o.y, ev); }
  if (godHit) { b.vx *= 0.9; b.vy *= 0.9; return; } // smash straight through
  // Two-body hit: the ball bounces and the defender gets shoved and spun
  const mb = b.heavy ? 14 : 1, e = Math.min(1.2, o.e + (b.jelly ? 0.3 : 0));
  const rn = rx * ct.ny - ry * ct.nx, j = -(1 + e) * vn / (1 / mb + 1 / o.m + rn * rn / o.I);
  b.x += ct.nx * ct.pen; b.y += ct.ny * ct.pen;
  b.vx += j * ct.nx / mb; b.vy += j * ct.ny / mb;
  o.vx -= j * ct.nx / o.m; o.vy -= j * ct.ny / o.m; o.av -= rn * j / o.I;
  if (o.kind === 'fat') { // belly bounce
    const out = b.vx * ct.nx + b.vy * ct.ny;
    if (out < 380) { b.vx += ct.nx * (380 - out); b.vy += ct.ny * (380 - out); }
  }
}
function hitArm(w, a, ev) {
  if (w.ball.ghost) return;
  const b = w.ball, ang = armAng(w, a), ex = Math.cos(ang) * a.len, ey = Math.sin(ang) * a.len;
  const t = clamp(((b.x - a.px) * ex + (b.y - a.py) * ey) / (a.len * a.len), 0, 1);
  const qx = a.px + ex * t, qy = a.py + ey * t, dx = b.x - qx, dy = b.y - qy, d = Math.hypot(dx, dy) || 0.01;
  if (d >= a.r + b.r) return;
  b.touched = true;
  const om = armOm(w, a) * (b.heavy ? 0.4 : 1);
  const s = bounce(b, { nx: dx / d, ny: dy / d, pen: a.r + b.r - d }, -om * (qy - a.py), om * (qx - a.px), b.heavy ? 0.3 : b.jelly ? 0.95 : 0.7);
  if (s > 60) ev.push({ t: 'arm', s, x: qx, y: qy });
}
function hitKeeper(w, team, ev) {
  if (w.ball.ghost) return;
  const b = w.ball, kx = keeperX(w, team), ky = keeperY(team);
  const qx = clamp(b.x, kx - KEEP.half, kx + KEEP.half), dx = b.x - qx, dy = b.y - ky, d = Math.hypot(dx, dy) || 0.01;
  if (d >= KEEP.r + b.r) return;
  b.touched = true;
  const s = bounce(b, { nx: dx / d, ny: dy / d, pen: KEEP.r + b.r - d }, keeperVx(w, team) * (b.heavy ? 0.4 : 1), 0, b.heavy ? 0.3 : b.jelly ? 0.95 : 0.8);
  if (s > 60) ev.push({ t: 'hit', x: qx, y: ky, s, kind: 'keeper' });
}

// ---------- update ----------

  else if (phase !== 'moving' && phase !== 'over') moveDefenders(world, dt);

    // face where they're running, or watch the ball when standing still

    if (mode === 'practice') {
      if (phase === 'moving' && !world.obs.some(o => o.team === 'blue')) {
        world.obs = layout('blue');
        popups.push({ x: world.ball.x, y: world.ball.y, t: 0, text: 'ALL CLEAR! NEW DEFENDERS', c: '#ffd166' });
        sfx.power(); ui();
      }
    } else if (wiped) { winner = other(wiped); wipeout = true; phase = 'over'; shake = 16; sfx.win(); ui(); }

    if (goalInfo.t > 2.4) {

    if (b.freeze && Math.random() < dt * 30) burst(b.x, b.y, 1, '#dff8ff', 40, 0.6, 2.5);
  }
  for (const o of world.obs) {
    if (o.hp < o.maxHp * 0.35 && Math.random() < dt * 4) burst(o.x + (Math.random() - 0.5) * 16, o.y + (Math.random() - 0.5) * 16, 1, '#59606a', 40, 1.1, 8, { smoke: true, drag: 1, grow: 12 });
    if (o.burn > 0 && Math.random() < dt * 30) burst(o.x + (Math.random() - 0.5) * o.br, o.y + (Math.random() - 0.5) * o.br, 1, '#ff8a2a', 50, 0.5, 5, { drag: 2 });
